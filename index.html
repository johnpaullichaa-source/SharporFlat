<script>
const SHARP=150; // score needed to be sharp

const $=i=>document.getElementById(i),R=a=>a[Math.floor(Math.random()*a.length)],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

function tier(){return S.lv=='adaptive'?Math.min(3,Math.floor(S.co/4)):LV[S.lv].t}

const SY={
pause:{n:'Pause',a:['pause','fermata'],o:['Treble clef','Semibreve'],g:()=>STF(90)+'<path d="M30 12a15 15 0 0 1 30 0" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="45" cy="9" r="3" fill="currentColor"/>'},

repeat:{n:'Repeat sign',a:['repeat'],o:['Quaver','Minim rest'],g:()=>STF(90)+'<circle cx="62" cy="30" r="3" fill="currentColor"/><circle cx="62" cy="40" r="3" fill="currentColor"/><line x1="72" x2="72" y1="15" y2="55" stroke="currentColor" stroke-width="2"/><line x1="80" x2="80" y1="15" y2="55" stroke="currentColor" stroke-width="5"/>'},

};
function symQ(mc){const k=R(Object.keys(SY)),y=SY[k],n=optN(),pool=Object.values(SY).map(z=>z.n).filter(z=>z!=y.n&&!y.o.includes(z));

return{svg:`<svg viewBox="0 0 ${k=='slur'||k=='tie'||k=='staff'?110:k=='barline'?130:90} ${y.h||70}" role="img" aria-label="Music symbol">${y.g()}</svg>`,syms:[],p:mc?'What is this symbol called?':'Type the name of this symbol',a:y.n,nm:y.a,o:opts.map(v=>({v,txt:v}))}}


function beamQ(mc){const four=Math.random()<.5,k=four?4:2,y=four?2:1,gap=four?22:34,x0=24;let g=STF(x0+gap*(k-1)+30);

function gen(){const t=tier(),n=optN(),mc=S.mode=='mc',x=Math.random(),nv=NV[t];let q;{const rr=Math.random();if(rr<.25)return symQ(mc);if(rr<.4)return beamQ(mc)}

const SONG=$('song');let songT;
function play(){SONG.volume=.8;const p=SONG.play();if(p&&p.catch)p.catch(()=>{});clearTimeout(songT);songT=setTimeout(()=>SONG.pause(),2200)}
let faceT;const FACES=['happy','excited','angry','unsure','nervous','worried','shocked'];FACES.forEach(k=>{new Image().src='faces/'+k+'.jpg'});
function face(k,t,ms){const f=$('fc');f.querySelector('img').src='faces/'+k+'.jpg';f.querySelector('span').textContent=t;f.classList.add('show');clearTimeout(faceT);faceT=setTimeout(()=>f.classList.remove('show'),ms||1600)}
function oldPlay(m){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.5)}
function buzz(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=110;g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.2)}
function hud(){$('sc').textContent=S.sc;$('cb').textContent='x'+Math.min(5,1+(S.st/3|0))}
function say(t,c){$('fb').textContent=t;$('fb').style.color=c}
function hs(v){const k='pkhi_'+S.mode+'_'+S.lv;try{if(v!=null){localStorage.setItem(k,v)}else return+localStorage.getItem(k)||0}catch(e){return 0}}
function good(){const m=Math.min(5,1+(S.st/3|0)),p=10*m;S.st++;S.bs=Math.max(S.bs,S.st);S.co++;S.sc+=p;
const r=rows[S.step],k=document.querySelectorAll('.ks i')[lanes[S.step]];r.classList.add('hit');k.classList.add('on');setTimeout(()=>k.classList.remove('on'),300);
play();const bk=document.querySelectorAll('.ks b')[Math.min(2,lanes[S.step])];bk.classList.add('on');setTimeout(()=>bk.classList.remove('on'),250);S.wrun=0;if(S.st%3==0)face('excited',S.st+' in a row!');else if(S.co==1)face('happy','Nice start!');S.step++;mv();hud();say('Correct! +'+p+(m>1?' (x'+m+' combo)':''),'var(--ok)');nq()}
function bad(msg){S.wr++;S.wrun=(S.wrun||0)+1;if(msg.startsWith('Time'))face('shocked','Too slow!');else face(S.wrun>=3?'angry':S.wrun==2?'worried':'unsure',S.wrun>=3?'Focus!':S.wrun==2?'Hmm...':'Not that one');S.st=0;S.endT-=LV[S.lv].pen*1000;buzz();hud();say(msg+(LV[S.lv].pen?' -'+LV[S.lv].pen+'s':''),'var(--no)')}
function miss(){bad("Time's up!");if(S.step>0){S.step--;rows[S.step].classList.remove('hit');mv()}nq()}
function check(v){const q=S.q,n=pn(v);if(n!==null)return Math.abs(n-q.a)<1e-9;return!!q.nm&&q.nm.includes(norm(v))}
function nq(){const q=S.q=gen();$('st').innerHTML=q.svg||(q.syms.length?draw(q.syms,q.gap):'');$('pr').textContent=q.p;$('hn').textContent=q.svg?'':tier()<2?'Hint: a quarter note (crotchet) = 1 beat':'';
S.qw=0;S.qEnd=S.qt?Date.now()+S.qt*1000:0;$('tbw').style.visibility=S.qt?'visible':'hidden';const a=$('an');a.innerHTML='';
if(S.mode=='mc'){a.className='opts';a.style.gridTemplateColumns=`repeat(${q.o.length>4?3:2},1fr)`;q.o.forEach((o,i)=>{const b=document.createElement('button');b.className='btn';b.innerHTML=o.sym?draw([o.sym]):o.txt;b.onclick=()=>pickO(o,b);a.appendChild(b)})}
else{a.className='';a.innerHTML='<div class="row"><input id="in" type="text" autocomplete="off" aria-label="Your answer" placeholder="Type your answer"><button class="btn go" style="margin:0;width:auto;font-size:16px;padding:8px 16px" id="en">Enter</button></div><div id="er"></div>';
$('en').onclick=sub;$('in').onkeydown=e=>{if(e.key=='Enter')sub();else $('er').textContent=''};$('in').focus()}}
function sub(){const v=$('in').value.trim();if(!v){$('er').textContent='Enter an answer first';return}if(check(v))good();else{bad('Not quite, try again');$('in').value='';$('in').focus()}}
function pickO(o,b){if(o.v==S.q.a)good();else{bad('Not quite, try again');b.classList.add('x');b.disabled=true}}
function tick(){const now=Date.now(),l=S.endT-now;if(l<=0){end();return}const s=Math.ceil(l/1000);$('tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('tm').style.color=s<=10?'var(--no)':'';if(s==10&&!S.w10){S.w10=1;face('nervous','10 seconds left!',2000)}
if(S.qEnd){const f=(S.qEnd-now)/(S.qt*1000);$('tb').style.width=Math.max(0,f*100)+'%';if(f<.3&&!S.qw){S.qw=1;face('nervous','Hurry!',1200)}if(f<=0)miss()}}
function start(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();
SONG.pause();try{SONG.currentTime=0}catch(e){}SONG.play().then(()=>SONG.pause()).catch(()=>{});
Object.assign(S,{wrun:0,w10:0,qw:0,sc:0,co:0,wr:0,st:0,bs:0,step:0,qt:LV[S.lv].qt,endT:Date.now()+60000});rows=[];lanes=[];$('rw').innerHTML='';$('rw').style.transition='none';mv();void $('rw').offsetWidth;$('rw').style.transition='';
$('m').hidden=$('e').hidden=true;$('g').hidden=false;hud();say('','');nq();face('happy','Let\'s play!');clearInterval(iv);iv=setInterval(tick,100);tick()}
function end(){clearInterval(iv);let b=0;const tot=S.co+S.wr;if(S.wr==0&&S.co>=5)b=50;S.sc+=b;const old=hs(),nw=S.sc>old;if(nw)hs(S.sc);
$('g').hidden=true;$('e').hidden=false;clearTimeout(songT);SONG.pause();$('fc').classList.remove('show');$('es').textContent=S.sc;const sp=S.sc>=SHARP;$('ef').src='faces/'+(sp?'excited':S.sc>=SHARP/2?'unsure':'worried')+'.jpg';$('eh').innerHTML=sp?'You are <span class="sh">sharp ♯</span>':'You are <span class="fl">flat ♭</span>';$('rm').textContent=sp?'Great note reading!':'Keep practising. Score '+SHARP+' or more to be sharp.';$('eb').textContent=(b?'Perfect run bonus: +50. ':'')+(nw?'New high score!':'');
$('ed').innerHTML=`<div>Correct<b>${S.co}</b></div><div>Accuracy<b>${tot?Math.round(S.co/tot*100):0}%</b></div><div>Best combo<b>${S.bs}</b></div><div>High score<b>${Math.max(old,S.sc)}</b></div>`}
function menu(){$('m').hidden=false;$('e').hidden=$('g').hidden=true;info()}
function info(){$('ip').textContent='Name the note value to move the tiles and play the tune. Score '+SHARP+' or more in 1 minute to be sharp. Score less and you are flat.';$('ld').textContent=LV[S.lv].d;$('bs').textContent='High score: '+hs()}
function sel(id,key){$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(c=>c.classList.toggle('sel',c==b));S[key]=b.dataset.v;info()}}
sel('mo','mode');sel('lv','lv');$('sb').onclick=start;$('pa').onclick=start;$('mn').onclick=menu;
document.addEventListener('keydown',e=>{if(S.mode=='mc'&&!$('g').hidden&&/^[1-6]$/.test(e.key)){const b=$('an').children[+e.key-1];if(b&&!b.disabled)b.click()}});
info();
</script></body></html>
